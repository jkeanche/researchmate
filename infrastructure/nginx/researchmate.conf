# ResearchMate AI — Nginx reverse proxy with TLS.
# Replace researchmate.example.com with your domain and place certificates in
# /etc/nginx/certs (fullchain.pem, privkey.pem), e.g. from certbot.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

upstream researchmate_web {
    server researchmate-web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name researchmate.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name researchmate.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;

    # Uploads stream straight through to the app; the app enforces plan limits.
    # Keep this at or above MAX_UPLOAD_SIZE_MB.
    client_max_body_size 110m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Sign-in and account endpoints get a stricter per-IP limit (the app also rate-limits per account).
    location ~ ^/(login|register|forgot-password|reset-password|verify-email) {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://researchmate_web;
    }

    location /_next/static/ {
        proxy_pass http://researchmate_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://researchmate_web;
    }
}
