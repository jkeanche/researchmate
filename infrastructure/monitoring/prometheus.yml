# Scrapes ResearchMate's /api/metrics over the internal Compose network.
# The bearer token is written from METRICS_TOKEN at container start.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: researchmate
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ["researchmate-web:3000"]
